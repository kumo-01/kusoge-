name: Deploy TURN credentials Worker

# Cloudflare の無料 TURN（直接つなげないネットワークでの中継）に使う Worker を公開する。
# 手動で実行する（Actions タブ → このワークフロー → Run workflow）。手順は README の「TURN（無料）」を参照。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.TURN_KEY_ID != '' && secrets.TURN_KEY_API_TOKEN != '' }}
    steps:
      - name: 必要な secret が揃っているか確認
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / TURN_KEY_ID / TURN_KEY_API_TOKEN の 4 つを Settings → Secrets and variables → Actions に登録してください（README の「TURN（無料）」参照）"
          exit 1
      - uses: actions/checkout@v4
      - name: Worker を公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/turn
          secrets: |
            TURN_KEY_ID
            TURN_KEY_API_TOKEN
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
