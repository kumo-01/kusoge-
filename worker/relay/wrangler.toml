name = "kusoge"
main = "index.js"
compatibility_date = "2025-01-01"

# 部屋ごとの Durable Object（無料プランで使えるのは SQLite 版）
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# ゲームを公開しているサイトのドメイン（カンマ区切りで複数可）。ここ以外のページからは使えない。
# 空にすると誰でも使える（おすすめしません）
ALLOWED_ORIGINS = "https://kumo-01.github.io"
